name: Canary

on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 * * * *

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build playground
        run: npx turbo run tsc build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playground tests
        run: TEST_URL=https://winglang.io/play npx playwright test
        working-directory: apps/playground
      - name: Run Tour tests
        run: TEST_URL=https://winglang.io/learn npx playwright test
        working-directory: apps/tour
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 30
