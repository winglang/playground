name: Canary

on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 * * * *

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build playground
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npx turbo run tsc build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playground tests
        uses: nick-fields/retry@v2
        with:
          max_attempts: 7
          timeout_minutes: 15
          command: |
            cd apps/playground
            TEST_URL=https://winglang.io/play npx playwright test
      - name: Run Tour tests
        uses: nick-fields/retry@v2
        with:
          max_attempts: 7
          timeout_minutes: 15
          command: |
            cd apps/tour
            TEST_URL=https://winglang.io/learn npx playwright test
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 30
